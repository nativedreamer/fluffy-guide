      <stop offset="0%" stop-color="#082f22"/>
      <stop offset="50%" stop-color="#0e3d2d"/>
      <stop offset="100%" stop-color="#06241a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
