  <polygon points="210,120 215,133 229,133 218,141 222,154 210,146 198,154 202,141 191,133 205,133" fill="#fcd34d" opacity="0.8"/>
  <polygon points="302,120 307,133 321,133 310,141 314,154 302,146 290,154 294,141 283,133 297,133" fill="#fcd34d" opacity="0.8"/>
  
  <!-- Text monogram "AEE" -->
